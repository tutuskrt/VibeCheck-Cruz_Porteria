<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VibeCheck 411L</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Inter', Arial, sans-serif;
      background: #fff;
      color: #111;
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
    }
    .container {
      background: #fff;
      margin-top: 48px;
      padding: 32px 32px 24px 32px;
      border-radius: 18px;
      box-shadow: 0 2px 12px 0 rgba(0,0,0,0.07);
      max-width: 420px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      font-size: 2.2rem;
      font-weight: 600;
      margin-bottom: 0.5em;
      color: #111;
      letter-spacing: 1px;
    }
    p {
      color: #222;
      margin-bottom: 2em;
      text-align: center;
    }
    .button-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 2em;
      justify-content: center;
    }
    button {
      background: #fff;
      color: #111;
      border: 2px solid #111;
      border-radius: 8px;
      padding: 0.7em 1.3em;
      font-size: 1.08rem;
      font-family: inherit;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.18s, color 0.18s, transform 0.1s;
      box-shadow: none;
      outline: none;
    }
    button:hover, button:focus {
      background: #111;
      color: #fff;
      transform: translateY(-2px) scale(1.04);
    }
    #out {
      background: #fff;
      color: #111;
      border-radius: 8px;
      border: 1.5px solid #111;
      padding: 1.2em 1em;
      font-size: 1.08rem;
      min-height: 5.5em;
      width: 100%;
      box-sizing: border-box;
      margin-top: 0.5em;
      font-family: 'Fira Mono', 'Consolas', monospace;
      box-shadow: none;
      overflow-x: auto;
      white-space: pre-wrap;
    }
    @media (max-width: 600px) {
      .container {
        padding: 18px 4vw 14px 4vw;
        margin-top: 18px;
      }
      h1 {
        font-size: 1.3rem;
      }
      .button-row {
        gap: 8px;
      }
      #out {
        font-size: 0.98rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>VibeCheck 411L</h1>
    <p>Welcome! Get your daily dev fortune, joke, or vibe check.<br>Powered by Node.js API.</p>
    <div class="button-row">
      <button id="btnFortune">🔮 Fortune</button>
      <button id="btnJoke">😂 Joke</button>
      <button data-mood="happy" class="btnMood">😄 Happy</button>
      <button data-mood="tired" class="btnMood">🥱 Tired</button>
      <button data-mood="stressed" class="btnMood">😵‍💫 Stressed</button>
      <button id="btnSmash">💥 SMASH!</button>
      <button id="btnSecret">🕵️ Secret</button>
    </div>
    <h2 style="margin-bottom:0.3em;align-self:flex-start;font-size:1.1rem;color:#111;font-weight:600;">Output</h2>
    <pre id="out">Ready...</pre>
  </div>
  <script src="app.js"></script>
</body>
</html>
